<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; color: #fff;
         background: radial-gradient(120% 120% at 85% 0%, #1d7a72 0%, #14655F 35%, #0B3B3A 75%); position: relative; }
  .brand { position: absolute; top: 46px; right: 64px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 92px; height: 92px; }
  .brand span { font-size: 64px; font-weight: 700; letter-spacing: .5px; }
  .hook { position: absolute; top: 170px; right: 64px; font-size: 92px; font-weight: 700; line-height: 1.15; }
  .hook em { font-style: normal; color: #C9A227; }
  .sub { position: absolute; top: 400px; right: 66px; font-size: 40px; font-weight: 500; color: #E6F2EF; }
  .card { position: absolute; left: 56px; top: 150px; width: 470px; background: #fff; color: #16302F; border-radius: 26px;
          box-shadow: 0 24px 60px rgba(0,0,0,.35); padding: 26px 28px; transform: rotate(-2.5deg); }
  .pill { display: inline-block; font-size: 26px; font-weight: 700; border-radius: 999px; padding: 4px 18px; }
  .red { background: #FBE7E4; color: #C0392B; } .amber { background: #FDF3DF; color: #B7791F; } .green { background: #E3F5EC; color: #1E8E5A; }
  .quote { font-family: Amiri, serif; font-size: 40px; font-weight: 700; margin: 14px 0 6px; }
  .verdict { font-size: 27px; color: #C0392B; font-weight: 700; }
  .lights { position: absolute; bottom: 56px; right: 64px; display: flex; gap: 16px; }
  .lights .pill { font-size: 30px; padding: 8px 24px; }
  .url { position: absolute; bottom: 64px; left: 64px; direction: ltr; font-size: 26px; color: #9FC9C2; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand"><img src="LOGO" alt=""><span>سند AI</span></div>
  <div class="hook">هل هذا الحديث<br><em>صحيح؟</em></div>
  <div class="sub">تحقّق قبل أن تنشر — بالمصدر وحكم العلماء</div>
  <div class="card">
    <span class="pill red">🔴 منسوب خطأً أو لا أصل له</span>
    <div class="quote">«اطلبوا العلم ولو بالصين»</div>
    <div class="verdict">ابن حبان: «باطل لا أصل له»</div>
  </div>
  <div class="lights">
    <span class="pill green">🟢 موثّق</span>
    <span class="pill amber">🟡 يحتاج مراجعة</span>
    <span class="pill red">🔴 لا أصل له</span>
  </div>
  <div class="url">sanadai-zl6q.onrender.com</div>
</body>
</html>
